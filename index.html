<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#15130E">
<meta name="robots" content="noindex, nofollow">
<title>טבלת יציאות · עיט־ראם</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* surfaces — warm charcoal, "situation board" */
  --bg:#15130E; --bg2:#100E0A;
  --panel:#211E17; --panel2:#2A261D; --panel3:#332E23;
  --line:#3B3527; --line2:#4A4331;
  --ink:#F5F0E4; --muted:#A79C86; --muted2:#7C7361;
  /* states — green = צבא (locked) */
  --army:#4F9E67; --army-d:#2F6A45; --army-glow:rgba(79,158,103,.16);
  --home:#D34B47; --home-glow:rgba(211,75,71,.14);
  --leaving:#E0A0A0; --returning:#5BC4E6;
  /* accent — brass, for today / selection (kept distinct from state colors) */
  --gold:#EBC26A; --gold-d:#C79A3C;
  --sat:#1B2A2A;
  --shadow:0 10px 34px rgba(0,0,0,.42);
  --shadow-s:0 4px 14px rgba(0,0,0,.30);
  --r:16px;
  font-synthesis-weight:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 520px at 80% -10%, #1d2a20 0%, transparent 60%),
    radial-gradient(900px 480px at -10% 8%, #2a2116 0%, transparent 55%),
    var(--bg);
  color:var(--ink);font-family:"Assistant",system-ui,-apple-system,sans-serif;
  font-size:15.5px;line-height:1.5;padding-bottom:40px;min-height:100vh}
h1,h2,h3{margin:0;font-family:"Rubik",system-ui,sans-serif}
button{font-family:inherit}
.serif{font-family:"Rubik",system-ui,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:0 15px}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ============ HEADER ============ */
header{padding:20px 0 8px}
.hgrid{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.brand h1{font-size:27px;font-weight:900;letter-spacing:-.4px;line-height:1.05;display:flex;align-items:center;gap:9px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--army);box-shadow:0 0 0 4px var(--army-glow);flex:0 0 auto}
.ait-link{position:relative;flex:0 0 auto;display:grid;place-items:center;width:26px;min-height:42px;color:var(--muted);
  text-decoration:none;border-radius:10px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:color .12s}
.ait-link svg{display:block;width:18px;height:22px}
.ait-link::after{content:"";position:absolute;inset:0 -4px}
.ait-link:hover{color:var(--ink)}
.ait-link:active{background:var(--panel2)}
.ait-link:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.brand .sub{color:var(--muted);font-size:13.5px;margin-top:5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;padding:3px 9px;border-radius:999px;
  border:1px solid var(--line2);color:var(--muted);background:var(--panel)}
.live .lp{width:7px;height:7px;border-radius:50%;background:var(--muted2)}
.live.ok .lp{background:var(--army);box-shadow:0 0 0 0 var(--army);animation:pulse 2.4s infinite}
.live.err{color:var(--leaving);border-color:rgba(224,120,92,.4)}
.live.err .lp{background:var(--leaving)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,158,103,.5)}70%{box-shadow:0 0 0 7px rgba(79,158,103,0)}100%{box-shadow:0 0 0 0 rgba(79,158,103,0)}}

/* ============ TOP BAR (today + report) ============ */
.topbar{display:flex;gap:9px;margin:15px 0 4px;align-items:stretch}
.today-card{flex:1;display:flex;align-items:center;gap:13px;background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line2);border-radius:var(--r);padding:12px 15px;box-shadow:var(--shadow-s);cursor:pointer;min-width:0;
  transition:transform .12s,border-color .12s}
.today-card:active{transform:scale(.99)}
.today-card:hover{border-color:var(--gold-d)}
.today-card .tc-date{flex:0 0 auto;text-align:center;padding-left:13px;border-left:1px solid var(--line)}
.today-card .tc-d{font-family:"Rubik",system-ui,sans-serif;font-weight:900;font-size:26px;line-height:.95}
.today-card .tc-m{font-size:11px;color:var(--muted);font-weight:600}
.today-card .tc-mid{flex:1;min-width:0}
.today-card .tc-lbl{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:.3px}
.today-card .tc-heb{font-family:"Rubik",system-ui,sans-serif;font-size:16px;font-weight:700;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.today-card .tc-ev{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.today-card .tc-counts{display:flex;gap:12px;margin-top:5px;font-size:13px;font-weight:700}
.today-card .tc-counts .a{color:var(--army)} .today-card .tc-counts .h{color:var(--home)}
.today-card .tc-counts small{color:var(--muted);font-weight:500}
.report-btn{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  width:78px;background:linear-gradient(180deg,#3a3016,#2a2312);border:1px solid var(--gold-d);border-radius:var(--r);
  color:var(--gold);font-weight:800;cursor:pointer;box-shadow:var(--shadow-s);transition:transform .12s}
.report-btn:active{transform:scale(.97)}
.report-btn svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:1.7}
.report-btn span{font-size:12.5px;letter-spacing:.2px}

/* ============ CONTROLS ============ */
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;gap:3px;margin:16px 0 12px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:14.5px;
  padding:10px;border-radius:10px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:7px}
.tabs button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabs button.on{background:var(--panel3);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.controls{display:flex;gap:9px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13.5px;padding:8px 16px;border-radius:9px;cursor:pointer;transition:.15s}
.seg button.on{background:var(--panel3);color:var(--ink)}
.seg button .cnt{font-size:11px;color:var(--muted2);margin-inline-start:5px;font-weight:600}
.search{flex:1;min-width:130px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:10px 14px;color:var(--ink);font-family:inherit;font-size:14.5px}
.search::placeholder{color:var(--muted2)}
.search:focus{outline:none;border-color:var(--gold-d)}

/* ============ LEGEND ============ */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 2px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}

/* ============ CALENDAR ============ */
.cal-month{margin-bottom:26px}
.cal-mhead{display:flex;align-items:baseline;gap:10px;margin:0 3px 11px}
.cal-mhead.cal-coll{align-items:center;cursor:pointer;user-select:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:0}
.cal-mhead.cal-coll:active{transform:scale(.995)}
.cal-arrow{margin-inline-start:auto;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
  border-radius:50%;background:var(--gold);color:var(--bg);font-size:12px;font-weight:900;transition:transform .2s}
.cal-mhead.cal-coll.open .cal-arrow{transform:rotate(180deg)}
.cal-body{margin-top:11px}
.cal-body[hidden]{display:none}
.cal-mhead .mg{font-family:"Rubik",system-ui,sans-serif;font-weight:900;font-size:21px}
.cal-mhead .mh{color:var(--gold);font-family:"Rubik",system-ui,sans-serif;font-weight:700;font-size:15px}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-dow div{text-align:center;font-size:11.5px;color:var(--muted2);font-weight:700}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{position:relative;min-height:104px;background:var(--panel);border:1px solid var(--line);border-radius:13px;
  padding:6px 5px 7px;display:flex;flex-direction:column;cursor:pointer;overflow:hidden;transition:transform .1s,border-color .12s,background .12s}
.cell.void{background:transparent;border-color:transparent;cursor:default;pointer-events:none}
.cell.out{opacity:.32;pointer-events:none}
.cell:not(.void):active{transform:scale(.97)}
.cell:not(.void):hover{border-color:var(--line2);background:var(--panel2)}
.cell .top{display:flex;flex-direction:column;align-items:flex-start;gap:0}
.cell .g{font-family:"Rubik",system-ui,sans-serif;font-weight:700;font-size:19px;line-height:1;color:var(--ink)}
.cell .heb{font-size:11px;color:var(--gold);font-weight:600;font-family:"Rubik",system-ui,sans-serif;line-height:1.1;opacity:.85;margin-top:1px}
.cell .todaydot2{font-size:9px;font-weight:800;color:var(--bg);background:var(--gold);padding:1px 6px;border-radius:5px;letter-spacing:.4px}
.cell .cbot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:5px}
.cell .ev{font-size:9.5px;font-weight:800;line-height:1.08;padding:2px 5px;border-radius:6px;align-self:stretch;text-align:center;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.cell .ev.parasha{color:#cdd8d1;background:rgba(102,169,198,.13)}
.cell .ev.holiday{color:#f3dca0;background:rgba(235,194,106,.16);box-shadow:inset 0 0 0 1px rgba(235,194,106,.25)}
.cell .ev.op{color:#e6c3b6;background:rgba(224,120,92,.13)}
.cell .mini{display:flex;justify-content:center;gap:8px;font-size:15px;font-weight:900;line-height:1}
.cell .mini .a{color:var(--army)} .cell .mini .h{color:var(--home)}
.cell.sat{background:linear-gradient(180deg,var(--sat),var(--panel))}
.cell.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 8px 22px rgba(235,194,106,.14);background:var(--panel2)}
.cell.today .g{color:var(--gold)}
.cell.picked{border-color:var(--ink)}

/* ============ HEATMAP (board) ============ */
.board-bar{display:flex;align-items:center;gap:9px;margin:0 2px 11px;flex-wrap:wrap}
.pill-sel{background:var(--panel2);color:var(--ink);border:1px solid var(--line2);font-weight:700;font-size:13.5px;padding:9px 16px;border-radius:11px;cursor:pointer}
.pill-sel.on{background:linear-gradient(180deg,#3a3016,#2a2312);border-color:var(--gold-d);color:var(--gold)}
.pill-sel:active{transform:scale(.96)}
.pill-clear{background:transparent;color:var(--muted);border:1px dashed var(--line2);font-weight:600;font-size:12.5px;padding:8px 13px;border-radius:11px;cursor:pointer}
.n-name.picking{cursor:pointer}
.n-name.picking .n-check{width:22px;height:22px;flex:0 0 auto;border-radius:6px;border:1.5px solid var(--line2);background:var(--panel);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:var(--gold)}
.n-name.selected{background:rgba(235,194,106,.1)}
.n-name.selected .n-check{border-color:var(--gold);background:var(--gold);color:var(--bg)}
.n-name.selected .nm{color:var(--gold);font-weight:800}
.pill-today{background:var(--gold);color:var(--bg);border:0;font-weight:800;font-size:13.5px;padding:9px 18px;border-radius:11px;cursor:pointer;
  font-family:"Rubik",sans-serif;box-shadow:0 4px 14px rgba(235,194,106,.22)}
.pill-today:active{transform:scale(.96)}
.board-hint{color:var(--muted2);font-size:12px}
.board{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.hm{display:flex}
.hm-names{flex:0 0 auto;width:104px;background:var(--panel2);border-inline-start:2px solid var(--line);z-index:2}
.hm-scroll{flex:1 1 auto;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.hm-grid{display:inline-block;min-width:100%}
.n-corner{height:46px}
.n-name{height:34px;display:flex;align-items:center;gap:7px;padding:0 10px;font-weight:700;font-size:13px;
  border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;overflow:hidden}
.n-name:hover{background:var(--panel3)}
.n-name .nm{overflow:hidden;text-overflow:ellipsis}
.n-sep{height:24px;display:flex;align-items:center;padding:0 10px;font-weight:800;font-size:11px;color:var(--muted);
  background:var(--bg);border-bottom:1px solid var(--line)}
.hm-hrow{display:flex;height:46px}
.dh{width:28px;flex:0 0 28px;height:46px;border-bottom:2px solid var(--line);border-inline-end:1px solid var(--line);
  text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--panel2)}
.dh .ddow{font-size:8px;color:var(--muted2);line-height:1.1}
.dh .dnum{font-size:12px;font-weight:800;line-height:1.15;font-family:"Rubik",system-ui,sans-serif}
.dh .dmon{font-size:7.5px;color:var(--muted2);line-height:1.1}
.dh.today{background:var(--gold)} .dh.today *{color:var(--bg)!important}
.dh.sat{background:var(--sat)}
.dh.event{box-shadow:inset 0 -3px 0 var(--gold)}
.hm-row{display:flex;height:34px}
.hm-sep{height:24px;border-bottom:1px solid var(--line);background:var(--bg)}
.c{width:28px;flex:0 0 28px;height:34px;border-bottom:1px solid rgba(0,0,0,.28);border-inline-end:1px solid rgba(0,0,0,.22);cursor:pointer;position:relative}
.c.today{box-shadow:inset 2px 0 0 var(--gold),inset -2px 0 0 var(--gold)}
.c-base{background:var(--army)} .c-leaving{background:var(--leaving)}
.c-returning{background:var(--returning)} .c-home{background:var(--home);opacity:.9}
.c-na{background:repeating-linear-gradient(45deg,#2a303b,#2a303b 5px,#232833 5px,#232833 10px)}

/* ============ PEOPLE ============ */
.pv-group{font-weight:800;font-size:12px;color:var(--muted);margin:18px 3px 9px;letter-spacing:.3px}
.prow{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:11px 13px;margin-bottom:8px;cursor:pointer;transition:.13s}
.prow:hover{background:var(--panel2);border-color:var(--line2)}
.prow:active{transform:scale(.995)}
.prow .pmid{flex:1;min-width:0}
.prow .pname{font-family:"Rubik",system-ui,sans-serif;font-weight:700;font-size:16px}
.prow .team-tag{font-size:11px;color:var(--muted2);font-weight:700}
.prow .bar{height:8px;border-radius:5px;background:var(--bg2);display:flex;overflow:hidden;margin:7px 0 5px}
.prow .bar .bh{background:var(--home)} .prow .bar .bb{background:var(--army)}
.prow .pst{font-size:12.5px;color:var(--muted)}
.prow .pst .sh{color:var(--home);font-weight:800} .prow .pst .sb{color:var(--army);font-weight:800}
.prow .chev{color:var(--muted2);font-size:20px}
.prow .now{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}

/* ============ AVATAR ============ */
.av{border-radius:50%;background-size:cover;background-position:center;flex:0 0 auto;display:inline-flex;
  align-items:center;justify-content:center;color:#fff;font-family:"Assistant";font-weight:800;overflow:hidden;
  border:1.5px solid rgba(255,255,255,.14)}

/* ============ MODAL ============ */
.modal-bg{position:fixed;inset:0;background:rgba(7,6,4,.72);backdrop-filter:blur(4px);
  display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal-bg.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:22px 22px 0 0;width:100%;
  max-width:580px;max-height:88vh;overflow:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -12px 44px rgba(0,0,0,.55);
  animation:up .24s cubic-bezier(.2,.8,.2,1);position:relative}
@keyframes up{from{transform:translateY(26px);opacity:.4}to{transform:none;opacity:1}}
@media(min-width:600px){.modal-bg{align-items:center}.modal{border-radius:22px}}
.modal .close{position:absolute;top:15px;inset-inline-start:15px;background:var(--panel3);border:0;color:var(--ink);
  width:34px;height:34px;border-radius:50%;font-size:19px;cursor:pointer;z-index:3;line-height:1}
.mhead{margin-bottom:14px;padding-inline-end:40px}
.mhead .mkick{font-size:12.5px;color:var(--gold);font-weight:700;letter-spacing:.3px}
.mhead h3{font-family:"Rubik",system-ui,sans-serif;font-size:24px;font-weight:900;line-height:1.1;margin-top:2px}
.mhead .mheb{font-family:"Rubik",system-ui,sans-serif;color:var(--muted);font-size:16px;margin-top:2px}
.mhead .mev{display:inline-block;margin-top:9px;font-size:13.5px;font-weight:800;padding:5px 12px;border-radius:999px}
.mhead .mev.parasha{color:#cdd8d1;background:rgba(102,169,198,.15)}
.mhead .mev.holiday{color:#f3dca0;background:rgba(235,194,106,.18)}
.mhead .mev.op{color:#e6c3b6;background:rgba(224,120,92,.15)}
/* nav header (day stepper) */
.mnav{display:flex;align-items:center;justify-content:center;gap:12px;margin:4px 0 6px;padding:0 4px}
.mnav-btn{flex:0 0 auto;width:44px;height:44px;border-radius:13px;background:var(--panel2);border:1px solid var(--line2);
  color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.mnav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mnav-btn:active{transform:scale(.93)} .mnav-btn:disabled{opacity:.22;cursor:default}
.mnav-mid{text-align:center;min-width:0;padding:0 4px}
.mnav-kick{font-size:12.5px;color:var(--gold);font-weight:700;letter-spacing:.2px}
.mnav-greg{font-family:"Rubik",sans-serif;font-weight:800;font-size:22px;line-height:1.12;margin-top:1px;white-space:nowrap}
.mnav-heb{font-size:13.5px;color:var(--muted);margin-top:2px;white-space:nowrap}
.mnav-ev{display:inline-block;margin:8px 0 14px;font-size:13px;font-weight:800;padding:5px 14px;border-radius:999px}
.mnav-ev.parasha{color:#cdd8d1;background:rgba(102,169,198,.15)}
.mnav-ev.holiday{color:#f3dca0;background:rgba(235,194,106,.18)}
.mnav-ev.op{color:#e6c3b6;background:rgba(224,120,92,.15)}
.msum{display:flex;gap:9px;margin:4px 0 16px}
.msum .box{flex:1;background:var(--panel2);border-radius:13px;padding:12px;text-align:center;position:relative;overflow:hidden}
.msum .box .n{font-family:"Rubik",system-ui,sans-serif;font-weight:900;font-size:28px;line-height:1}
.msum .box .l{font-size:12px;color:var(--muted);margin-top:3px;font-weight:600}
.msum .box.a .n{color:var(--army)} .msum .box.h .n{color:var(--home)}
.msum .box::after{content:"";position:absolute;top:0;inset-inline-end:0;width:4px;height:100%}
.msum .box.a::after{background:var(--army)} .msum .box.h::after{background:var(--home)}
.mgrouplbl{font-weight:800;font-size:12.5px;color:var(--muted);margin:15px 0 8px;display:flex;align-items:center;gap:8px}
.mgrouplbl i{width:11px;height:11px;border-radius:3px;display:inline-block}
.mppl{display:flex;flex-wrap:wrap;gap:7px}
.pchip{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;
  padding:5px 12px 5px 6px;font-size:13.5px;font-weight:600}
.pchip .tt{font-size:10px;color:var(--muted2);font-weight:700}
.pchip.b{border-color:rgba(79,158,103,.35)} .pchip.l{border-color:rgba(224,120,92,.35)}
.pchip.r{border-color:rgba(102,169,198,.35)} .pchip.h{border-color:rgba(211,75,71,.3)}

/* personal timeline mini-cal */
.mbig{display:flex;gap:9px;margin:6px 0 8px}
.mbig .box{flex:1;background:var(--panel2);border-radius:13px;padding:13px;text-align:center;position:relative;overflow:hidden}
.mbig .box .n{font-family:"Rubik",system-ui,sans-serif;font-weight:900;font-size:30px}
.mbig .box .l{font-size:12px;color:var(--muted);margin-top:2px}
.mbig .box.a .n{color:var(--army)} .mbig .box.h .n{color:var(--home)}
.pmini{margin-top:8px}
.pmini .pmhead{font-weight:800;font-size:13px;color:var(--muted);margin:14px 0 7px;font-family:"Rubik",system-ui,sans-serif}
.pmini .pmg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.pmini .pmdow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.pmini .pmdow div{text-align:center;font-size:9.5px;color:var(--muted2);font-weight:700}
.pmini .pd{aspect-ratio:1;border-radius:7px;background:var(--panel3);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:rgba(255,255,255,.82);position:relative}
.pmini .pd.void{background:transparent}
.pmini .pd.b{background:var(--army)} .pmini .pd.l{background:var(--leaving)}
.pmini .pd.r{background:var(--returning)} .pmini .pd.h{background:var(--home);color:rgba(0,0,0,.6)}
.pmini .pd.na{background:repeating-linear-gradient(45deg,#2a303b,#2a303b 4px,#232833 4px,#232833 8px);color:#5a6472}
.pmini .pd.today{box-shadow:0 0 0 2px var(--gold)}

/* ============ REPORT / SHARE CARD ============ */
.rep-actions{display:flex;gap:9px;margin-top:6px}
.rep-actions .rb{flex:1;padding:12px;border-radius:13px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);
  font-weight:800;font-size:14.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.rep-actions .rb.prim{background:linear-gradient(180deg,#3a3016,#2a2312);border-color:var(--gold-d);color:var(--gold)}
.rep-actions .rb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.rep-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.rep-nav button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);width:38px;height:38px;border-radius:11px;font-size:18px;cursor:pointer}
.rep-nav .lbl{font-family:"Rubik",system-ui,sans-serif;font-weight:800;font-size:16px}

/* the actual shareable card (rendered to image) */
.sharecard{width:100%;background:linear-gradient(165deg,#20291f 0%,#181510 55%,#211a10 100%);border:1px solid #3d4a3a;
  border-radius:18px;padding:20px 20px 18px;color:#f5f0e4;position:relative;overflow:hidden}
.sc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:13px;margin-bottom:14px}
.sc-title{font-family:"Rubik",system-ui,sans-serif;font-weight:900;font-size:21px;display:flex;align-items:center;gap:8px}
.sc-title .d{width:9px;height:9px;border-radius:50%;background:#4F9E67}
.sc-sub{font-size:13px;color:#a79c86;margin-top:3px}
.sc-datebox{text-align:center;flex:0 0 auto}
.sc-datebox .g{font-family:"Rubik",system-ui,sans-serif;font-weight:900;font-size:30px;line-height:.9;color:#EBC26A}
.sc-datebox .m{font-size:11px;color:#a79c86;font-weight:700}
.sc-datebox .heb{font-family:"Rubik",system-ui,sans-serif;font-size:13px;color:#f5f0e4;margin-top:3px}
.sc-ev{display:inline-block;font-size:13px;font-weight:800;padding:5px 13px;border-radius:999px;margin-bottom:14px;
  background:rgba(235,194,106,.16);color:#f3dca0}
.sc-nums{display:flex;gap:11px;margin-bottom:16px}
.sc-num{flex:1;border-radius:13px;padding:13px;text-align:center;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
.sc-num .v{font-family:"Rubik",system-ui,sans-serif;font-weight:900;font-size:32px;line-height:1}
.sc-num .k{font-size:12.5px;color:#a79c86;margin-top:3px;font-weight:600}
.sc-num.a .v{color:#6BC58A} .sc-num.h .v{color:#E5716D}
.sc-sec{font-weight:800;font-size:13px;margin:0 0 9px;display:flex;align-items:center;gap:8px;color:#cfc6b1}
.sc-sec i{width:10px;height:10px;border-radius:3px}
.sc-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:15px}
.sc-p{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:600}
.sc-p .mark{width:8px;height:8px;border-radius:50%}
.sc-foot{border-top:1px solid rgba(255,255,255,.1);padding-top:11px;display:flex;justify-content:space-between;font-size:11.5px;color:#7c7361}

/* ============ MISC ============ */
.inactive-bar{display:flex;justify-content:center;margin:18px 0 4px}
.inactive-bar button{background:transparent;border:1px dashed var(--line2);color:var(--muted2);font-size:12.5px;font-weight:600;
  padding:7px 15px;border-radius:999px;cursor:pointer}
.inactive-bar button:hover{color:var(--muted);border-color:var(--muted2)}
.footer{text-align:center;color:var(--muted2);font-size:12px;margin-top:26px;line-height:1.7}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .live.ok .lp{animation:none}}
.loading{text-align:center;color:var(--muted);padding:60px 0;font-size:15px}
.spin{width:26px;height:26px;border:3px solid var(--line2);border-top-color:var(--gold);border-radius:50%;
  animation:sp .8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}

/* ============ EDIT MODE + STATUS PICKER ============ */
.rb.on{background:linear-gradient(180deg,#3a3016,#2a2312);border-color:var(--gold-d);color:var(--gold)}
.edit-hint{font-size:12.5px;color:var(--gold);background:rgba(235,194,106,.1);border:1px solid rgba(235,194,106,.25);
  border-radius:11px;padding:9px 12px;margin:2px 0 14px;line-height:1.4;text-align:center}
.pchip.editable,.sc-p.editable{cursor:pointer;box-shadow:inset 0 0 0 1px var(--gold-d)}
.pchip.editable:active,.sc-p.editable:active{transform:scale(.96)}
.pchip.edited,.sc-p.edited{position:relative}
.pchip.edited::after,.sc-p.edited::after{content:"✎";position:absolute;top:-6px;inset-inline-start:-4px;font-size:10px;
  background:var(--gold);color:var(--bg);width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800}
.pmini .pd.edited{box-shadow:0 0 0 2px var(--gold)}
.cell .ovdot{position:absolute;bottom:5px;inset-inline-start:6px;width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--panel)}
.pick-bg{position:fixed;inset:0;background:rgba(6,6,4,.66);backdrop-filter:blur(4px);z-index:70;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:600px){.pick-bg{align-items:center}}
.pick{background:var(--panel);border:1px solid var(--line2);border-radius:20px 20px 0 0;width:100%;max-width:440px;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(0,0,0,.5);animation:up .2s ease}
@media(min-width:600px){.pick{border-radius:20px}}
.pick-h{font-family:"Rubik",sans-serif;font-weight:800;font-size:18px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:baseline}
.pick-h span{font-size:14px;color:var(--muted);font-weight:600}
.pick-opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pick-o{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  font-family:"Rubik",sans-serif;font-weight:700;font-size:14.5px;padding:14px 12px;border-radius:13px;cursor:pointer}
.pick-o i{width:13px;height:13px;border-radius:4px;flex:0 0 auto}
.pick-o.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.pick-o:active{transform:scale(.97)}
.pick-reset{width:100%;margin-top:10px;background:transparent;border:1px dashed var(--line2);color:var(--muted);
  font-weight:600;font-size:13.5px;padding:12px;border-radius:13px;cursor:pointer}
.pick-cancel{width:100%;margin-top:9px;background:var(--panel3);border:0;color:var(--ink);font-weight:700;font-size:14.5px;padding:13px;border-radius:13px;cursor:pointer}

/* ============ LOW-HEADCOUNT: alerts + red frame ============ */
.cell.low{outline:2px solid #FF5B5B;outline-offset:-2px}
.alerts-wrap{display:flex;flex-direction:column;gap:10px;margin:14px 0 2px}
.alert-card{background:rgba(255,91,91,.08);border:1px solid rgba(255,91,91,.4);border-radius:var(--r);padding:13px 14px}
.alert-top{display:flex;align-items:center;gap:11px;margin-bottom:4px}
.alert-top svg{width:26px;height:26px;stroke:#FF6B6B;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.alert-title{font-family:"Rubik",sans-serif;font-weight:800;font-size:15.5px;color:#FF8A8A}
.alert-sub{font-size:13px;color:var(--muted);font-weight:600;margin-top:1px}
.al-day{margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,91,91,.18)}
.al-day-h{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:3px 0;cursor:pointer;color:inherit;font:inherit;text-align:inherit}
.al-day-h:active{opacity:.6}
.al-chev{width:15px;height:15px;stroke:#FF6B6B;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;transition:transform .18s}
.al-day.open .al-chev{transform:rotate(180deg)}
.al-d{font-weight:700;font-size:14px;flex:1 1 auto}
.al-n{font-family:"Rubik",sans-serif;font-weight:800;font-size:13.5px;color:#FF6B6B;flex:0 0 auto}
.al-list{display:flex;flex-wrap:wrap;gap:6px;margin:3px 0 5px;padding-right:23px}
.al-list[hidden]{display:none}
.al-p{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.al-t{font-size:10px;color:var(--muted2);font-weight:700}
/* collapsible group (בבית בתצוגת יום) — נראה כמו כפתור ברור */
.mgrouplbl.collapser{cursor:pointer;user-select:none;background:var(--panel2);border:1px solid var(--line2);
  border-radius:12px;padding:11px 13px;margin:16px 0 0}
.mgrouplbl.collapser:active{transform:scale(.99)}
.coll-arrow{margin-inline-start:auto;display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--bg);font-size:12px;font-weight:900;transition:transform .2s}
.mgrouplbl.collapser.open .coll-arrow{transform:rotate(180deg)}
.coll-body{margin-top:10px}
.coll-body[hidden]{display:none}  /* גובר על .mppl{display:flex} */
/* alert pop-up (חד-פעמי) */
.alert-pop{max-width:480px}
.alert-pop-h{display:flex;align-items:center;gap:10px;font-family:"Rubik",sans-serif;font-weight:800;font-size:18px;color:#FF8A8A;margin-bottom:12px}
.alert-pop-h svg{width:27px;height:27px;stroke:#FF6B6B;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.alert-pop-body{max-height:55vh;overflow:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
</style>

/* ============================================================
   טבלת יציאות עיט־ראם — שליפה חיה מ-Google Sheets
   ============================================================ */
const SHEET_ID="1hOsROZXuqRUZjZ-CCJYnKDhlWEm8xmwEc7AdRPsUUUQ";
const SHEET_NAME="יציאות הביתה סבב 7";

const EDIT_CODE="7024";

function tryEnableEdit(){
  if(editUnlocked){editMode=true;return true;}

function ovKey(date,name){return date+'~'+name;}
function catFor(rec,name){const o=OVERRIDES[ovKey(rec.date,name)];return (o&&o.cat)?o.cat:catOf(rec.people[name]);}
function isEdited(date,name){return !!OVERRIDES[ovKey(date,name)];}
function dayHasEdits(date){for(const k in OVERRIDES){if(k.slice(0,date.length+1)===date+'~')return true;}return false;}
async function fetchOverrides(){
  try{const r=await fetch(DB_URL+'/overrides.json',{cache:'no-store'});if(!r.ok)return false;
    const j=await r.json()||{};
    if(JSON.stringify(j)!==JSON.stringify(OVERRIDES)){OVERRIDES=j;return true;}return false;
  }catch(e){console.warn('overrides fetch',e);return false;}
}
async function writeOverride(date,name,cat){
  const key=ovKey(date,name);
  if(cat)OVERRIDES[key]={cat,at:Date.now()};else delete OVERRIDES[key];
  recompute();renderAll();if(modalRefresh)modalRefresh();
  try{
    const r=await fetch(DB_URL+'/overrides/'+encodeURIComponent(key)+'.json',
      {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(cat?{cat,at:Date.now()}:null)});
    if(!r.ok)throw new Error(r.status);
  }catch(e){console.warn('override write failed',e);alert('השמירה לא עברה — בדוק חיבור לאינטרנט ונסה שוב.');}
}

}

/* ---------- hebrew date (Intl + gematria) ---------- */
const HFMT=new Intl.DateTimeFormat('he-u-ca-hebrew',{day:'numeric',month:'long',year:'numeric'});
function gematria(n){
  const ones=['','א','ב','ג','ד','ה','ו','ז','ח','ט'],tens=['','י','כ','ל','מ','נ','ס','ע','פ','צ'],
        huns=['','ק','ר','ש','ת','תק','תר','תש','תת','תתק'];
  let s=huns[Math.floor(n/100)%10]||'';let r=n%100;
  if(r===15)s+='טו';else if(r===16)s+='טז';else s+=(tens[Math.floor(r/10)]||'')+(ones[r%10]||'');
  if(s.length===1)s+='׳';else if(s.length>1)s=s.slice(0,-1)+'״'+s.slice(-1);
  return s;
}
function hebParts(d){let day,mon,yr;for(const p of HFMT.formatToParts(d)){
  if(p.type==='day')day=+p.value;else if(p.type==='month')mon=p.value;else if(p.type==='year')yr=+p.value;}
  return{day,mon,yr};}
function hebShort(d){const h=hebParts(d);return gematria(h.day)+' '+h.mon;}          // כ״ד באלול
function hebFull(d){const h=hebParts(d);return gematria(h.day)+' '+h.mon+' '+gematria(h.yr%1000);} // + תשפ״ז

function parse(iso){const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d);}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

/* ---------- event classification (from column Q) ---------- */
const HOLIDAY_KW=['ר״ה','ראש השנה','יו״כ','כיפור','סוכות','שמחת תורה','שמח״ת','חג','פורים','פסח','שבועות','חנוכה'];
const OP_KW=['אימון','משימה','תעסוקה','עליה','ירידה','תרגיל'];
function evClass(ev){
  ev=(ev||'').trim();if(!ev)return'';
  if(HOLIDAY_KW.some(k=>ev.includes(k)))return'holiday';
  if(OP_KW.some(k=>ev.includes(k)))return'op';
  return'parasha';
}
const EVMAP=[['ר״ה','ראש השנה'],['יו״כ','יום כיפור'],['שמח״ת','שמחת תורה']];
function expandEv(ev){ev=(ev||'').trim();for(const[a,b]of EVMAP)ev=ev.split(a).join(b);return ev;}
function evShort(ev){return expandEv(ev).replace(/\s*\(.*?\)\s*/g,' ').trim();} // "ר״ה"->"ראש השנה", "האזינו (שובה)"->"האזינו"

/* ---------- roster / counts ---------- */
function roster(){
  let list=[];
  if(team==='all'||team==='1')list=list.concat(DATA.team1.map(n=>({name:n,team:1})));
  if(team==='all'||team==='2')list=list.concat(DATA.team2.map(n=>({name:n,team:2})));
  if(!showInactive)list=list.filter(p=>!INACTIVE.includes(p.name));
  if(query)list=list.filter(p=>p.name.includes(query.trim()));
  return list;
}
function teamOf(name){return DATA.team1.includes(name)?1:2;}
function counts(name){
  const c={base:0,returning:0,leaving:0,home:0,na:0,total:0};
  DATA.records.forEach(r=>{c[catFor(r,name)]++;c.total++;});
  c.army=c.base+c.returning;               // בצבא (ספירת ראש יומית) — לא כולל "יוצא"
  c.away=c.home+c.leaving;                  // בבית — כולל "יוצא" (בדרך הביתה)
  c.armyAny=c.base+c.returning+c.leaving;   // מעורבות צבא כלשהי (לדו״ח ולזיהוי "לא בסבב")
  c.tracked=c.army+c.away;return c;
}
function recByIso(d){return DATA.records.find(r=>r.date===d);}
/* per-day grouping over current roster (na = ללא נתונים, לא מוצג/נספר) */
function dayGroups(rec){
  const g={base:[],returning:[],leaving:[],home:[],na:[]};
  roster().forEach(p=>{g[catFor(rec,p.name)].push(p.name);});
  return g;
}

/* ============================================================
   DATA LOADING
   ============================================================ */
function parseCSV(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=ch;}
    else{if(ch==='"')q=true;else if(ch===','){row.push(f);f='';}
      else if(ch==='\n'){row.push(f);rows.push(row);row=[];f='';}
      else if(ch==='\r'){}else f+=ch;}
  }
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows;
}
/* main sheet → עיט (B–O) + אירועים (Q) + טווח התאריכים. עמודות ראם (S–AE) מוזנחות בכוונה. */
/* הכל מהאקסל הראשי: עיט = ריצת-הכותרות הראשונה, ראם = הריצה השנייה, אירוע = עמודת-הטקסט שבפער. זיהוי דינמי. */
function buildMain(rows){
  const hdr=rows[0]||[];
  const runs=[];let cur=null;
  for(let i=1;i<hdr.length;i++){const v=(hdr[i]||'').trim();
    if(v){if(!cur){cur=[];runs.push(cur);}cur.push({name:v,i});}else cur=null;}
  const t1=runs[0]||[],t2=runs[1]||[];
  let EV=16;
  if(t1.length&&t2.length){
    for(let i=t1[t1.length-1].i+1;i<t2[0].i;i++){
      let txt=0,num=0;
      for(let r=1;r<Math.min(rows.length,40);r++){const v=(rows[r][i]||'').trim();if(!v)continue;/^\d+$/.test(v)?num++:txt++;}
      if(txt>num){EV=i;break;}
    }
  }
  const idx=t1.concat(t2);
  const records=[];
  for(let r=1;r<rows.length;r++){
    const row=rows[r];const dstr=(row[0]||'').trim();if(!dstr)continue;
    const dt=new Date(dstr);if(isNaN(dt))continue;
    const people={};idx.forEach(o=>people[o.name]=(row[o.i]||'').trim());
    records.push({date:iso(dt),event:(row[EV]||'').trim(),people});
  }
  if(!records.length)throw new Error('no rows');
  return{team1:t1.map(o=>o.name),team2:t2.map(o=>o.name),records};
}
/* ----- ראם: משיכה מ-Firebase + גזירת קטגוריות מהרצף הכרונולוגי ----- */
async function fetchReem(){
  try{const r=await fetch(REEM_URL,{cache:'no-store'});if(!r.ok)return false;
    const j=await r.json();
    if(JSON.stringify(j)!==JSON.stringify(REEM)){REEM=j;return true;}return false;
  }catch(e){console.warn('reem fetch',e);return false;}
}
/* מחליף את ראם (team2) בנתונים מהגיליון הנפרד, וגוזר base/returning/leaving/home.
   מיפוי מלא (דו-כיווני, מסתכל על יום-לפני + יום-אחרי), תואם למסמך של נבו:
   נוכח ראשון-ברצף (אחרי היעדרות) = מגיע→returning ·
   נוכח אחרון לפני היעדרות אמיתית (לא יוצא) = יוצא→leaving ·
   נוכח אחרת = שטח→base ·
   יוצא ישר אחרי נוכח = יוצא→leaving · יוצא בהמשך = יציאה→home ·
   ? / זמין / לא-נוכח / לא-מוכר = לא נמצא→home · ריק = אין מידע→na.
   תא ריק אינו "היעדרות" לצורך הסקת יוצא (כל עוד העתיד לא מולא). */
function applyReem(){
  if(!REEM||!REEM.roster||!REEM.days)return;
  const roster=REEM.roster.filter(Boolean);
  const recs=DATA.records;
  (DATA.team2||[]).forEach(n=>recs.forEach(r=>{delete r.people[n];}));
  DATA.team2=roster.slice();
  roster.forEach(name=>{
    const raw=recs.map(rec=>{const v=(REEM.days[rec.date]||{})[name];return(v==null?'':(''+v)).trim();});
    for(let i=0;i<recs.length;i++){
      const cur=raw[i], prev=i>0?raw[i-1]:null, next=i<recs.length-1?raw[i+1]:null;
      let cat;
      if(cur==='נוכח'){
        if(prev!==null&&prev!==''&&prev!=='נוכח')                       cat='returning'; // מגיע
        else if(next!==null&&next!==''&&next!=='נוכח'&&next!=='יוצא')    cat='leaving';   // יוצא (אחרון לפני היעדרות)
        else                                                           cat='base';      // שטח
      }
      else if(cur==='יוצא')  cat=(prev==='נוכח')?'leaving':'home';
      else if(cur==='?')     cat='home';
      else if(cur==='')      cat='na';      // ריק — אין מידע (לא מסיקים ממנו "יוצא")
      else                   cat='home';    // זמין / לא נוכח/זמין / לא זמין / לא מוכר
      recs[i].people[name]=cat;
    }
  });
}
const EXCLUDE=new Set(['אברהם קלנר','יאיר ללוש']);   // לא חלק מהכוח / שורה מוסתרת בגיליון — מתעלמים לגמרי
function recompute(){
  DATA.team1=DATA.team1.filter(n=>!EXCLUDE.has(n));
  DATA.team2=DATA.team2.filter(n=>!EXCLUDE.has(n));
  INACTIVE=DATA.team1.concat(DATA.team2).filter(n=>counts(n).armyAny===0);
  todayIdx=DATA.records.findIndex(r=>r.date===isoToday);
}
function setLive(state,txt){
  const el=document.getElementById('liveTag');el.className='live '+state;
  el.innerHTML='<span class="lp"></span>'+txt;
}
async function load(){
  try{
    const r=await fetch(CSV_URL,{cache:'no-store'});
    if(!r.ok)throw new Error('main '+r.status);
    const d=buildMain(parseCSV(await r.text()));
    DATA=d;await fetchReem();applyReem();recompute();
    setLive('ok','חי · עודכן '+new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}));
    renderAll();maybeShowAlertPopup();
  }catch(e){
    console.warn('live fetch failed',e);
    if(DATA){applyReem();recompute();setLive('err','לא מקוון · מוצג עותק שמור');renderAll();maybeShowAlertPopup();}
    else{document.getElementById('viewCal').innerHTML='<div class="loading">שגיאה בטעינת הנתונים.<br>בדוק חיבור לאינטרנט ונסה לרענן.</div>';setLive('err','שגיאה');}
  }
}

/* ---------- סד״כ נמוך: ספירת נוכחים ליום + התראות שבוע קדימה ---------- */
const LOW_THRESHOLD=8;         // פחות מזה = יום בעייתי
const ALERT_HORIZON=7;         // כמה ימים קדימה סורקים
/* רוסטר מלא — כל מי שבסבב, שני הצוותים, ללא תלות בחיפוש/פילטר צוות (לספירה הכללית בלבד) */
function fullRoster(){return DATA.team1.concat(DATA.team2).filter(n=>!INACTIVE.includes(n));}
function dayPresent(rec){const g={base:[],returning:[],leaving:[],home:[],na:[]};
  fullRoster().forEach(n=>g[catFor(rec,n)].push(n));return{n:g.base.length+g.returning.length,g};}
function isLow(rec){return dayPresent(rec).n<LOW_THRESHOLD;}
function lowWindow(){ // אינדקסים של ימים נמוכים בחלון הקרוב
  const recs=DATA.records;let start=todayIdx>=0?todayIdx:0;const low=[];
  for(let i=start;i<=start+ALERT_HORIZON&&i<recs.length;i++){if(isLow(recs[i]))low.push(i);}
  return low;
}
function alertSignature(){return lowWindow().map(i=>DATA.records[i].date).join(',');}
function alertCardsHTML(){ // בונה את כרטיסי ההתראה (משותף לבאנר ולפופ-אפ)
  const recs=DATA.records,low=lowWindow();if(!low.length)return'';
  const groups=[];let cur=[low[0]];
  for(let k=1;k<low.length;k++){if(low[k]===low[k-1]+1)cur.push(low[k]);else{groups.push(cur);cur=[low[k]];}}
  groups.push(cur);
  const nm=name=>`<span class="al-p">${name}<span class="al-t">${teamOf(name)===1?'עיט':'ראם'}</span></span>`;
  const dstr=i=>{const d=parse(recs[i].date);return`${DOWL[d.getDay()]} ${d.getDate()}.${d.getMonth()+1}`;};
  let html='';
  groups.forEach(grp=>{
    const a=grp[0],b=grp[grp.length-1];
    const head=grp.length>1?`ימים ${DOWL[parse(recs[a].date).getDay()]}–${DOWL[parse(recs[b].date).getDay()]} · ${parse(recs[a].date).getDate()}.${parse(recs[a].date).getMonth()+1}–${parse(recs[b].date).getDate()}.${parse(recs[b].date).getMonth()+1}`:dstr(a);
    let body='';
    grp.forEach(i=>{const {n,g}=dayPresent(recs[i]);const present=[...g.base,...g.returning];
      body+=`<div class="al-day" data-day="${recs[i].date}">
        <button class="al-day-h" type="button" aria-expanded="false">
          <svg class="al-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
          <span class="al-d">${dstr(i)}</span><span class="al-n">${n} בצבא</span></button>
        <div class="al-list" hidden>${present.length?present.map(nm).join(''):'<span class="al-p" style="opacity:.6">אין נוכחים</span>'}</div>
      </div>`;});
    html+=`<div class="alert-card">
      <div class="alert-top"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9l-8 14A2 2 0 004 21h16a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
        <div><div class="alert-title">שימו לב · סד״כ נמוך</div><div class="alert-sub">${head}</div></div></div>
      ${body}</div>`;
  });
  return html;
}
/* חיווט כרטיסי התראה: לחיצה על הכותרת פותחת/סוגרת את רשימת האנשים;
   לחיצה על הרשימה פותחת את תצוגת היום המלאה. */
function wireAlertCards(root,onOpen){
  root.querySelectorAll('.al-day').forEach(day=>{
    const h=day.querySelector('.al-day-h'),list=day.querySelector('.al-list');
    if(h)h.onclick=()=>{const show=list.hasAttribute('hidden');list.toggleAttribute('hidden',!show);h.setAttribute('aria-expanded',show?'true':'false');day.classList.toggle('open',show);};
    if(list)list.onclick=()=>{if(onOpen)onOpen(day.dataset.day);};
  });
}
function renderAlerts(){
  const el=document.getElementById('alerts');if(!el)return;
  const cards=alertCardsHTML();
  el.innerHTML=cards?`<div class="alerts-wrap">${cards}</div>`:'';
  wireAlertCards(el,d=>openDay(d));
}
/* פופ-אפ חד-פעמי למשתמש (קופץ שוב רק אם רשימת הימים הנמוכים השתנתה) */
let alertPopupDone=false;
function maybeShowAlertPopup(){
  if(alertPopupDone)return;
  const sig=alertSignature();if(!sig){alertPopupDone=true;return;}
  let seen='';try{seen=localStorage.getItem('yatziot_alert_seen')||'';}catch(e){}
  if(sig===seen){alertPopupDone=true;return;}
  alertPopupDone=true;
  const bg=document.createElement('div');bg.className='pick-bg';
  bg.innerHTML=`<div class="pick alert-pop">
    <div class="alert-pop-h"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9l-8 14A2 2 0 004 21h16a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg><span>התראת סד״כ נמוך</span></div>
    <div class="alert-pop-body">${alertCardsHTML()}</div>
    <button class="pick-cancel" id="alertPopClose">הבנתי, סגור</button>
  </div>`;
  document.body.appendChild(bg);
  const close=()=>{bg.remove();try{localStorage.setItem('yatziot_alert_seen',sig);}catch(e){}};
  bg.onclick=e=>{if(e.target===bg)close();};
  bg.querySelector('#alertPopClose').onclick=close;
  wireAlertCards(bg,d=>{close();openDay(d);});
}

/* ---------- CALENDAR (main) ---------- */
function renderCal(){
  const el=document.getElementById('viewCal');
  const recs=DATA.records;const byIso={};recs.forEach((r,i)=>byIso[r.date]={r,i});
  const first=parse(recs[0].date),last=parse(recs.at(-1).date);
  // months to render
  const months=[];let cur=new Date(first.getFullYear(),first.getMonth(),1);
  while(cur<=last){months.push(new Date(cur));cur.setMonth(cur.getMonth()+1);}
  let html='';
  months.forEach(m=>{
    const y=m.getFullYear(),mo=m.getMonth();
    const days=new Date(y,mo+1,0).getDate();const firstDow=new Date(y,mo,1).getDay();
    // hebrew month label (from mid-month)
    const hp=hebParts(new Date(y,mo,15));
    const finished=new Date(y,mo+1,0)<realToday;   // כל החודש כבר עבר → מכווץ
    html+=`<div class="cal-month"><div class="cal-mhead${finished?' cal-coll':''}"><span class="mg serif">${MONL[mo]} ${y}</span><span class="mh serif">${hp.mon.replace(/^ב/,'')}</span>${finished?'<span class="cal-arrow">▾</span>':''}</div>`;
    html+=`<div class="cal-body"${finished?' hidden':''}>`;
    html+=`<div class="cal-dow">`+['א','ב','ג','ד','ה','ו','ש'].map(d=>`<div>${d}</div>`).join('')+`</div>`;
    html+=`<div class="cal-grid">`;
    for(let i=0;i<firstDow;i++)html+=`<div class="cell void"></div>`;
    for(let dd=1;dd<=days;dd++){
      const date=new Date(y,mo,dd),is=iso(date),hit=byIso[is],hd=gematria(hebParts(date).day);
      if(!hit){html+=`<div class="cell out"><div class="top"><span class="g serif tnum">${dd}</span><span class="heb">${hd}</span></div></div>`;continue;}
      const rec=hit.r,g=dayGroups(rec);
      const army=g.base.length+g.returning.length,home=g.home.length+g.leaving.length,tot=army+home;
      const evc=evClass(rec.event);
      const isToday=is===isoToday;
      const aw=tot?Math.round(army/tot*100):0;
      let cls='cell';if(date.getDay()===6)cls+=' sat';if(isLow(rec))cls+=' low';if(isToday)cls+=' today';
      html+=`<div class="${cls}" data-day="${is}" tabindex="0" role="button" aria-label="${dd} ${MONL[mo]}">
        <div class="top"><span class="g serif tnum">${dd}</span><span class="heb">${hd}</span></div>
        <div class="cbot">
          ${rec.event?`<div class="ev ${evc}">${evShort(rec.event)}</div>`:''}
          <div class="mini tnum"><span class="a">${army}</span><span class="h">${home}</span></div>
        </div>
      </div>`;
    }
    html+=`</div></div></div>`;
  });
  el.innerHTML=html;
  el.querySelectorAll('.cell[data-day]').forEach(c=>{
    c.onclick=()=>openDay(c.dataset.day);
    c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDay(c.dataset.day);}};
  });
  el.querySelectorAll('.cal-mhead.cal-coll').forEach(h2=>h2.onclick=()=>{h2.classList.toggle('open');const b=h2.nextElementSibling;if(b)b.hidden=!b.hidden;});
}

/* ---------- HEATMAP (board) ---------- */
function renderBoard(){
  const recs=DATA.records;
  // סקופ: כשיש נבחרים ולא במצב בחירה — מציגים רק אותם
  let scope=roster();
  const filtering=!boardSelect&&boardSelected.size>0;
  if(filtering)scope=scope.filter(p=>boardSelected.has(p.name));
  // סרגל הלוח

        return`<div class="c c-${c} ${r.date===isoToday?'today':''}" data-day="${r.date}" title="${p.name}"></div>`;}).join('')+'</div>';
    });
  }
  const t1=scope.filter(p=>p.team===1),t2=scope.filter(p=>p.team===2);
  block(t1,'עיט');block(t2,'ראם');
  document.getElementById('hmNames').innerHTML=nh;
  document.getElementById('hmGrid').innerHTML=gh;
  // bindings
  document.getElementById('jumpToday').onclick=()=>{const t=document.querySelector('.dh.today');if(t)t.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});};

  const cs=document.getElementById('clearSel');if(cs)cs.onclick=()=>{boardSelected.clear();boardSelect=false;renderBoard();};
  document.querySelectorAll('.n-name').forEach(n=>n.onclick=()=>{
    if(boardSelect){const nm=n.dataset.name;boardSelected.has(nm)?boardSelected.delete(nm):boardSelected.add(nm);renderBoard();}
    else openPerson(n.dataset.name);
  });
  document.querySelectorAll('.dh').forEach(h=>h.onclick=()=>openDay(recs[+h.dataset.idx].date));
  document.querySelectorAll('.hm-grid .c').forEach(c=>c.onclick=()=>openDay(c.dataset.day));
  const t=document.querySelector('.dh.today');if(t)t.scrollIntoView({inline:'center',block:'nearest'});
}

/* ---------- PERSON (timeline as mini-calendar) ---------- */
function openPerson(name){
  const c=counts(name),tot=c.total||1,t=teamOf(name);
  const recs=DATA.records,byIso={};recs.forEach(r=>byIso[r.date]=r);
  const first=parse(recs[0].date),last=parse(recs.at(-1).date);
  const months=[];let cur=new Date(first.getFullYear(),first.getMonth(),1);
  while(cur<=last){months.push(new Date(cur));cur.setMonth(cur.getMonth()+1);}
  let mini='';
  months.forEach(m=>{
    const y=m.getFullYear(),mo=m.getMonth(),days=new Date(y,mo+1,0).getDate(),fd=new Date(y,mo,1).getDay();
    mini+=`<div class="pmhead serif">${MONL[mo]}</div><div class="pmdow">`+['א','ב','ג','ד','ה','ו','ש'].map(x=>`<div>${x}</div>`).join('')+`</div><div class="pmg">`;
    for(let i=0;i<fd;i++)mini+=`<div class="pd void"></div>`;
    for(let dd=1;dd<=days;dd++){
      const is=iso(new Date(y,mo,dd)),rec=byIso[is];
      if(!rec){mini+=`<div class="pd void"></div>`;continue;}
      const cat=catFor(rec,name);
      mini+=`<div class="pd ${CAT[cat].cls} ${is===isoToday?'today':''} ${isEdited(is,name)?'edited':''}" title="${MONL[mo]} ${dd} · ${CAT[cat].label}${isEdited(is,name)?' (נערך)':''}">${dd}</div>`;
    }
    mini+=`</div>`;
  });
  const h=`<div class="mhead" style="display:flex;gap:13px;align-items:center;padding-inline-end:40px">
      ${avatar(name,54,true)}
      <div><div class="mkick">${t===1?'צוות עיט':'צוות ראם'}</div><h3 class="serif" style="margin-top:2px">${name}</h3></div>
    </div>
    <div class="mbig">
      <div class="box a"><div class="n serif tnum">${c.army}</div><div class="l">ימים בצבא</div></div>
      <div class="box h"><div class="n serif tnum">${c.away}</div><div class="l">ימים בבית</div></div>
    </div>
    <div class="legend" style="margin:4px 2px 2px">
      <span><i style="background:var(--army)"></i>בבסיס ${c.base}</span>
      <span><i style="background:var(--returning)"></i>חוזר ${c.returning}</span>
      <span><i style="background:var(--leaving)"></i>יוצא ${c.leaving}</span>
      <span><i style="background:var(--home)"></i>בבית ${c.home}</span>
      ${c.na?`<span><i style="background:#4a5464"></i>ללא נתונים ${c.na}</span>`:''}
    </div>
    <div class="pmini">${mini}</div>`;
  openModal(h);
  modalEl.querySelectorAll('[data-upload]').forEach(a=>a.onclick=()=>triggerUpload(name));
}

/* draw the report image directly on canvas — no external library, works offline & on iOS */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function buildReportCanvas(){
  const rec=recByIso(reportDate),d=parse(reportDate),g=dayGroups(rec);
  const C={base:'#4F9E67',returning:'#5BC4E6',leaving:'#E0A0A0',home:'#D34B47'};
  const present=[...g.base.map(n=>[n,C.base]),...g.returning.map(n=>[n,C.returning]),...g.leaving.map(n=>[n,C.leaving])];
  const absent=g.home.map(n=>[n,C.home]);
  const evt=expandEv(rec.event);
  const W=720,P=44,DPR=2,chipH=48,chipGap=10,rowGap=10,dot=9,headerH=70,numH=98;
  const F=(w,s)=>`${w} ${s}px "Rubik",Arial,sans-serif`;
  const mc=document.createElement('canvas').getContext('2d');
  function layout(list){
    const rows=[];let x=W-P,y=0,row=[];const x0=P;
    for(const[name,color]of list){
      const team=DATA.team1.includes(name)?'עיט':'ראם';
      mc.font=F(700,21);const nameW=mc.measureText(name).width;
      mc.font=F(600,14);const teamW=mc.measureText(team).width;
      const w=16+dot+9+nameW+9+teamW+16;
      if(x-w<x0){rows.push({y,chips:row});row=[];y+=chipH+rowGap;x=W-P;}
      row.push({rx:x,w,name,color,nameW,team});x-=w+chipGap;
    }
    if(row.length)rows.push({y,chips:row});
    return{rows,h:list.length?y+chipH:34};
  }
  const l1=layout(present),l2=layout(absent);
  const cs=P+headerH+14;
  const H=cs+(evt?46:0)+numH+22+(22+l1.h+22)+(22+l2.h+22)+44;
  const cv=document.createElement('canvas');cv.width=W*DPR;cv.height=H*DPR;
  const ctx=cv.getContext('2d');ctx.scale(DPR,DPR);ctx.direction='rtl';
  const gr=ctx.createLinearGradient(0,0,W,H);gr.addColorStop(0,'#212a20');gr.addColorStop(.55,'#17140f');gr.addColorStop(1,'#221a10');
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#3d4a3a';ctx.lineWidth=2;rr(ctx,1,1,W-2,H-2,20);ctx.stroke();
  // header
  ctx.textAlign='right';ctx.font=F(800,30);ctx.fillStyle='#F5F0E4';
  const title='יציאות עיט־ראם';ctx.fillText(title,W-P,P+30);
  const tW=ctx.measureText(title).width;
  ctx.beginPath();ctx.arc(W-P-tW-13,P+22,6,0,7);ctx.fillStyle='#4F9E67';ctx.fill();
  ctx.font=F(600,15.5);ctx.fillStyle='#A79C86';ctx.fillText('דו״ח נוכחות יומי · סבב 7',W-P,P+55);
  ctx.textAlign='left';ctx.font=F(800,46);ctx.fillStyle='#EBC26A';ctx.fillText(String(d.getDate()),P,P+40);
  const dW=ctx.measureText(String(d.getDate())).width;
  ctx.font=F(600,15);ctx.fillStyle='#A79C86';ctx.fillText(MONL[d.getMonth()],P+dW+9,P+22);
  ctx.font=F(600,16);ctx.fillStyle='#F5F0E4';ctx.fillText(hebShort(d),P+dW+9,P+42);
  ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(P,P+headerH);ctx.lineTo(W-P,P+headerH);ctx.stroke();
  let yy=cs;
  if(evt){ctx.font=F(800,16);const ew=ctx.measureText(evt).width,pw=ew+34,px=W-P-pw;
    ctx.fillStyle='rgba(235,194,106,.16)';rr(ctx,px,yy,pw,34,17);ctx.fill();
    ctx.textAlign='right';ctx.fillStyle='#f3dca0';ctx.fillText(evt,W-P-17,yy+23);yy+=46;}
  const gap=16,bw=(W-2*P-gap)/2;
  function numBox(x,val,label,col){
    ctx.fillStyle='rgba(255,255,255,.04)';rr(ctx,x,yy,bw,numH,14);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;rr(ctx,x,yy,bw,numH,14);ctx.stroke();
    ctx.textAlign='center';ctx.font=F(800,44);ctx.fillStyle=col;ctx.fillText(String(val),x+bw/2,yy+54);
    ctx.font=F(600,15);ctx.fillStyle='#A79C86';ctx.fillText(label,x+bw/2,yy+82);
  }
  numBox(W-P-bw,present.length,'בצבא (נמצאים)','#6BC58A');
  numBox(P,absent.length,'בבית','#E5716D');
  yy+=numH+22;
  function drawChip(c,y){
    const x0=c.rx-c.w;
    ctx.fillStyle='rgba(255,255,255,.05)';rr(ctx,x0,y,c.w,chipH,chipH/2);ctx.fill();
    ctx.beginPath();ctx.arc(c.rx-16-dot/2,y+chipH/2,dot/2,0,7);ctx.fillStyle=c.color;ctx.fill();
    const nameRight=c.rx-16-dot-9;ctx.textBaseline='middle';ctx.textAlign='right';
    ctx.font=F(700,21);ctx.fillStyle='#F5F0E4';ctx.fillText(c.name,nameRight,y+chipH/2+1);
    ctx.font=F(600,14);ctx.fillStyle='#8a8069';ctx.fillText(c.team,nameRight-c.nameW-9,y+chipH/2+1);
    ctx.textBaseline='alphabetic';
  }
  function section(label,col,lay){
    ctx.fillStyle=col;rr(ctx,W-P-15,yy-13,15,15,4);ctx.fill();
    ctx.textAlign='right';ctx.font=F(800,20);ctx.fillStyle='#cfc6b1';ctx.fillText(label,W-P-25,yy);yy+=22;
    if(!lay.rows.length){ctx.font=F(600,16);ctx.fillStyle='#7c7361';ctx.textAlign='right';ctx.fillText('אין',W-P,yy+20);}
    else for(const rw of lay.rows)for(const c of rw.chips)drawChip(c,yy+rw.y);
    yy+=lay.h+22;
  }
  section(`בצבא · ${present.length}`,'#4F9E67',l1);
  section(`בבית · ${absent.length}`,'#D34B47',l2);
  ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(P,yy-4);ctx.lineTo(W-P,yy-4);ctx.stroke();
  ctx.font=F(600,13);ctx.fillStyle='#7c7361';
  ctx.textAlign='right';ctx.fillText('עיט + ראם',W-P,yy+20);
  ctx.textAlign='left';ctx.fillText('נוצר '+new Date().toLocaleDateString('he-IL'),P,yy+20);
  return cv;
}
async function shareReport(){
  const btn=document.getElementById('shareImg');
  const old=btn.innerHTML;btn.innerHTML='<span class="spin" style="width:16px;height:16px;margin:0;border-width:2px"></span>מכין…';btn.disabled=true;
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const cv=buildReportCanvas();
    const blob=await new Promise(res=>cv.toBlob(res,'image/png'));
    if(!blob)throw new Error('no blob');
    const file=new File([blob],`דוח-נוכחות-${reportDate}.png`,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'דו״ח נוכחות · עיט־ראם'});
    }else{
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;
      document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    }
  }catch(e){if(e&&e.name==='AbortError'){}else{console.warn(e);alert('לא הצלחתי להפיק תמונה. נסה שוב או צלם מסך.');}}
  btn.innerHTML=old;btn.disabled=false;
}

/* ---------- avatar upload ---------- */
let uploadTarget=null;const avInput=document.getElementById('avInput');
function triggerUpload(name){uploadTarget=name;avInput.click();}
avInput.onchange=()=>{const f=avInput.files[0];if(!f||!uploadTarget)return;const rd=new FileReader();
  rd.onload=()=>{const img=new Image();img.onload=()=>{const s=128,cv=document.createElement('canvas');cv.width=cv.height=s;
    const ct=cv.getContext('2d');const r=Math.min(img.width,img.height);ct.drawImage(img,(img.width-r)/2,(img.height-r)/2,r,r,0,0,s,s);
    AV[uploadTarget]=cv.toDataURL('image/jpeg',.8);saveAV();renderAll();if(modalBg.classList.contains('on'))openPerson(uploadTarget);};
    img.src=rd.result;};rd.readAsDataURL(f);avInput.value='';};

else document.getElementById('viewCal').innerHTML='<div class="loading"><div class="spin"></div>טוען נתונים מהגיליון…</div>';

/* shared edits: pull once, then poll + on focus */
function syncOverrides(){Promise.all([fetchOverrides(),fetchReem()]).then(([a,b])=>{if(a||b){applyReem();recompute();renderAll();if(modalRefresh)modalRefresh();}});}
syncOverrides();
setInterval(syncOverrides,8000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncOverrides();});
